<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compras Públicas en Acción</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Concepto: revista tipo flipbook de 16 páginas (pliego doble) sobre un escenario neutro; cada página usa un eje de color. */
:root{
  --stage:#E4E9F0; --stage-fg:#1B2433; --panel:#FFFFFF; --panel-line:#C5CEDB; --btn:#14213D; --btn-fg:#FFFFFF;
  --paper:#FBFCFD; --ink:#14213D; --ink-soft:#46536B; --rule:#D5DBE5; --tint:#EDF1F6;
  --prob:#3acafc; --prob2:#aed7ff; --efi:#5ac599; --efi2:#cfff66; --part:#193a97; --part2:#0090ff; --accent:#D93A3A; --navy:#0A1A3F;
  --f-display:"GobCL","Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"GobCL","Public Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--stage:#0D131F; --stage-fg:#E6EAF2; --panel:#182131; --panel-line:#2B3850; --btn:#E6EAF2; --btn-fg:#0D131F; color-scheme:dark}
}
:root[data-theme="dark"]{--stage:#0D131F; --stage-fg:#E6EAF2; --panel:#182131; --panel-line:#2B3850; --btn:#E6EAF2; --btn-fg:#0D131F; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--stage);color:var(--stage-fg);font-family:var(--f-body);padding-block:12px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100vh}
a{color:inherit}

/* Controles */
.ctrl{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 auto 12px;max-width:1120px}
.ctrl button{font:600 13px/1 var(--f-body);background:var(--btn);color:var(--btn-fg);border:0;border-radius:6px;padding:10px 14px;cursor:pointer;min-height:40px}
.ctrl button:disabled{opacity:.35;cursor:default}
.ctrl button:focus-visible,.toc a:focus-visible,.res a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ctrl .ind{font:600 13px/1.2 var(--f-body);min-width:150px;text-align:center;font-variant-numeric:tabular-nums}
body.full{padding-block:8px 8px}body.full .legend{display:none}body.full .ctrl{margin-bottom:8px}
.ctrl .ghost{background:transparent;color:var(--stage-fg);border:1px solid var(--panel-line)}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:12px;margin:0 auto 14px;opacity:.85}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* Libro */
.stage{width:100%;display:flex;justify-content:center;overflow:hidden}
.scaler{transform-origin:top left;flex:none}
.book{position:relative;width:1120px;height:740px;transition:transform 1s cubic-bezier(.5,.1,.2,1)}
.book.s0{transform:translateX(-280px)}
.book.s8{transform:translateX(280px)}
.book.s0 .shadow{left:590px}.book.s8 .shadow{right:590px}
.shadow{position:absolute;left:30px;right:30px;bottom:-8px;height:26px;background:radial-gradient(ellipse at center,rgba(0,0,0,.35),transparent 70%);filter:blur(6px);pointer-events:none}
.leaf{position:absolute;top:0;left:560px;width:560px;height:740px;transform-origin:left center;transform:perspective(2600px) rotateY(0deg);transition:transform 1s cubic-bezier(.5,.1,.2,1);transform-style:preserve-3d}
.leaf.flipped{transform:perspective(2600px) rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper)}
.face.back{transform:rotateY(180deg)}
.face::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,rgba(10,20,40,.20),rgba(10,20,40,.05) 5%,transparent 12%)}
.face.back::after{background:linear-gradient(to left,rgba(10,20,40,.20),rgba(10,20,40,.05) 5%,transparent 12%)}
.leaf .face{box-shadow:0 1px 0 rgba(0,0,0,.08)}

/* Modo lectura vertical (pantallas angostas) */
.flow{display:flex;flex-direction:column;align-items:center;gap:18px}
.flow .slot{position:relative;flex:none}
.flow .slot .pg{position:absolute;left:0;top:0;transform-origin:top left;box-shadow:0 6px 24px rgba(0,0,0,.25)}

/* Página */
.pg{position:relative;width:560px;height:740px;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:12px;line-height:1.45;overflow:hidden;display:flex;flex-direction:column;padding:26px 38px 22px}
.pg.eje-p{--e:var(--prob);--e2:var(--prob2);--e-ink:#0B2545;--e-text:#0A6A93}
.pg.eje-e{--e:var(--efi);--e2:var(--efi2);--e-ink:#0B2545;--e-text:#1B7A57}
.pg.eje-a{--e:var(--part);--e2:var(--part2);--e-ink:#FFFFFF;--e-text:var(--part)}
.pg.eje-n{--e:var(--ink);--e2:var(--prob2);--e-ink:#fff;--e-text:var(--ink)}
.pg::before{content:"";position:absolute;top:0;bottom:0;width:9px;background:var(--e)}
.pg.odd::before{right:0}
.pg.even::before{left:0}
.pg.odd{padding-left:46px;padding-right:48px}
.pg.even{padding-left:48px;padding-right:46px}
.pg-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--rule);margin-bottom:18px;font:700 9.5px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.tag{background:var(--e);color:var(--e-ink);padding:5px 8px 4px;border-radius:2px;letter-spacing:.14em}
.pg-b{flex:1;min-height:0;display:flex;flex-direction:column;gap:11px;overflow:hidden}
.pg-f{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--rule);padding-top:8px;margin-top:10px;font:600 9.5px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.pg.even .pg-f{flex-direction:row-reverse}
.pn{font:800 20px/1 var(--f-display);letter-spacing:0;color:var(--e-text)}

h2{font:800 29px/1.04 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font:800 15px/1.2 var(--f-display);margin:0 0 4px;letter-spacing:.005em;text-wrap:balance}
p{margin:0}
.kick{font:700 10px/1 var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--e-text);margin-bottom:8px}
.lede{font-size:14px;line-height:1.4;color:var(--ink)}
.small{font-size:10.5px;line-height:1.4;color:var(--ink-soft)}
.src{font-size:9.5px;line-height:1.4;color:var(--ink-soft);margin-top:auto;padding-top:6px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cols3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.cols3 .stat b{font-size:24px}
.box{background:var(--tint);background:color-mix(in srgb,var(--e2) 20%,#fff);padding:12px 14px;border-radius:3px}
.quote{border-left:4px solid var(--e);padding:2px 0 2px 14px;font:700 17px/1.25 var(--f-display);color:var(--ink)}
.quote span{display:block;font:500 10px/1.4 var(--f-body);color:var(--ink-soft);margin-top:6px}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.list li{padding-left:14px;position:relative}
.list li::before{content:"";position:absolute;left:0;top:.55em;width:6px;height:6px;background:var(--e);border-radius:1px}
.rowl{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:start}
.big{font:900 40px/.95 var(--f-display);letter-spacing:-.02em;color:var(--e-text)}
.big small{font-size:.5em;letter-spacing:0}
.stat{border-top:3px solid var(--e);padding-top:8px;display:flex;flex-direction:column;gap:4px}
.stat b{font:900 30px/1 var(--f-display);letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;line-height:1.35;color:var(--ink-soft)}
.stat.p{border-color:var(--prob)} .stat.e{border-color:var(--efi)} .stat.a{border-color:var(--part)}

.stk{display:grid;grid-template-columns:92px 1fr;gap:8px;align-items:center;font-size:11px;line-height:1.2}
.stk .t{display:flex;height:22px;border-radius:2px;overflow:hidden}
.stk .t i{display:flex;align-items:center;justify-content:center;font:800 10px/1 var(--f-display);font-style:normal;font-variant-numeric:tabular-nums}
.stk .a{background:#1B7A57;color:#fff}.stk .b{background:var(--e);color:#0B2545}
.leg{display:flex;gap:14px;font-size:10.5px;margin:2px 0 6px}.leg span{display:inline-flex;align-items:center;gap:5px}.leg u{display:inline-block;width:11px;height:11px;border-radius:2px;text-decoration:none}
.bar.w{grid-template-columns:150px 1fr 46px}.bar.x{grid-template-columns:100px 1fr 68px}.stk .a.s{font-size:9px}
.bar.w2 .t i{background:#1B7A57}
.via{border-left:4px solid #1B7A57;padding-left:10px}.via.j{border-left-color:var(--e)}
.via h3{margin:0 0 3px}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:128px 1fr 44px;gap:8px;align-items:center;font-size:11px;line-height:1.2}
.bar .t{height:14px;background:var(--tint);border-radius:2px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--e);border-radius:2px}
.bar .v{font:800 12px/1 var(--f-display);text-align:right;font-variant-numeric:tabular-nums}
.tl{display:flex;flex-direction:column;position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--rule)}
.tl li{list-style:none;display:grid;grid-template-columns:62px 1fr;gap:8px;padding:6px 0;position:relative}
.tl li::before{content:"";position:absolute;left:-20px;top:11px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:3px solid var(--c)}
.tl .d{font:800 12px/1.25 var(--f-display);color:var(--ink)}
.tl .d small{display:block;font:600 9px/1.2 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.tl .x{font-size:11.5px;line-height:1.35}
.tl{margin:0}
.toc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.toc a{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--rule);text-decoration:none;cursor:pointer}
.toc a:hover b{color:var(--e-text)}
.toc .n{font:900 18px/1 var(--f-display);color:var(--c)}
.toc b{font:700 13.5px/1.2 var(--f-display)}
.toc em{font:600 9px/1 var(--f-display);font-style:normal;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.res{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.res li{display:grid;grid-template-columns:50px 1fr;gap:8px;padding:5px 0;border-bottom:1px solid var(--rule);font-size:11px;line-height:1.3}
.res .d{font:800 10.5px/1.3 var(--f-display);color:var(--ink-soft)}
.res a{text-decoration:none;font-weight:600}
.res a:hover{text-decoration:underline}
.pill{display:inline-block;font:700 9px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;background:var(--e);color:var(--e-ink);padding:4px 6px 3px;border-radius:2px;margin-right:6px}
.before-after{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ba{background:var(--tint);padding:12px;border-radius:3px;display:flex;flex-direction:column;gap:6px}
.ba .meter{height:46px;display:flex;align-items:flex-end;gap:0}
.ba .meter i{display:block;width:100%;background:var(--e)}
.ba b{font:900 30px/1 var(--f-display)}

/* Portada */
.pg.cover::before{display:none}
.cover .mark{display:flex;justify-content:space-between;font:700 10px/1 var(--f-display);letter-spacing:.2em;text-transform:uppercase;opacity:.9}
.cover .sub{position:relative;font:600 11px/1.3 var(--f-display);letter-spacing:.2em;text-transform:uppercase;opacity:.85}
.cover .tz{position:absolute;left:46px;right:38px;bottom:30px;display:flex;flex-direction:column;gap:9px}
.cover .tz div{display:grid;grid-template-columns:10px 1fr;gap:10px;align-items:start;font-size:12.5px;line-height:1.3;font-weight:600}
.cover .tz i{display:block;width:10px;height:10px;margin-top:3px;border-radius:2px}
.cover .tz small{display:block;font:700 9px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;opacity:.65;margin-bottom:3px}
.pg.back-cover{background:var(--navy);color:#fff;justify-content:space-between}
.pg.back-cover::before{display:none}
.back-cover .eje{display:flex;flex-direction:column;gap:12px}
.back-cover .eje div{border-top:3px solid var(--c);padding-top:8px}
.back-cover .eje b{font:800 17px/1.1 var(--f-display);display:block;margin-bottom:3px}
.back-cover .eje span{font-size:11.5px;opacity:.8;line-height:1.35}


.logo{display:inline-flex;align-items:center}
.logo img{height:40px;width:auto;display:block}
.cover .mark,.back-cover .mark{align-items:center}
/* Jerarquía de notas: titular, bajada, imagen o cifra principal, destacados y detalle */
.hero{margin:0;position:relative;flex:none;border-radius:2px}
.hero img{display:block;width:100%;height:auto;border-radius:2px}
.hero figcaption{padding:4px 0 0;font:500 9.5px/1.3 var(--f-body);color:var(--ink-soft)}
.hero.noimg{min-height:150px;background:linear-gradient(135deg,var(--e),var(--e2));display:flex;align-items:flex-end;padding:0 10px 8px}
.hero.noimg figcaption{color:var(--e-ink);padding:0;font-size:10px}
.lead2{display:grid;grid-template-columns:1.18fr 1fr;gap:14px;align-items:start}
.lead2 .lede{font-size:12.5px;line-height:1.42}
.hero.sh{display:flex;align-items:center;gap:18px;padding:0 20px;height:auto;min-height:92px;background:var(--e);color:var(--e-ink)}
.hero.sh b{font:900 54px/1 var(--f-display);letter-spacing:-.03em;white-space:nowrap}
.hero.sh span{font:700 15px/1.25 var(--f-display);text-wrap:balance}
.dest{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.dest.c2{grid-template-columns:1fr 1fr}
.dest .d{border-top:3px solid var(--e);background:color-mix(in srgb,var(--e2) 20%,#fff);padding:8px 9px 9px;display:flex;flex-direction:column;gap:3px;min-width:0}
.dest .d b{font:900 22px/1.05 var(--f-display);letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums}
.dest .d span{font-size:10.5px;line-height:1.3;color:var(--ink-soft)}
.detail{columns:2;column-gap:18px;font-size:11px;line-height:1.4}
.detail p,.detail div{break-inside:avoid;margin-bottom:6px}
.detail h4{font:800 11.5px/1.2 var(--f-display);margin:0 0 2px;color:var(--e-text)}
.duo{display:grid;grid-template-columns:132px 1fr;gap:12px;align-items:start}
.duo .hero.noimg{min-height:84px}
.pg.cover{background:var(--navy);color:#fff;padding:0}
.cover .cphoto{position:absolute;left:0;right:0;top:0;height:470px;margin:0;background:linear-gradient(150deg,#193a97 0%,#0090ff 100%);overflow:hidden}
.cover .cphoto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:57% 20%}
.cover .cphoto span{position:absolute;left:46px;right:38px;top:215px;font:700 11px/1.4 var(--f-display);letter-spacing:.12em;text-transform:uppercase;opacity:.85;text-align:center;padding:0 24px}
.cover .shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,26,63,.78),rgba(10,26,63,0) 24%,rgba(10,26,63,0) 34%,#0A1A3F 60%)}
.cover .mark{position:absolute;left:46px;right:38px;top:32px}
.cover .ct{position:absolute;left:46px;right:38px;top:372px}
.cover h1{margin:0;font:900 50px/.97 var(--f-display);letter-spacing:-.02em}
.cover h1 span{color:#cfff66}
.cover .sub{margin-top:12px}
.cover .tz{bottom:42px}
.cover .credit{position:absolute;left:46px;right:38px;bottom:14px;font:500 9.5px/1.3 var(--f-body);opacity:.85}
.cover .credit a{color:#fff}

@media (prefers-reduced-motion: reduce){.book,.leaf{transition-duration:.01s}}
</style>

</head>
<body>
<div class="ctrl" role="toolbar" aria-label="Navegación de la revista">
  <button type="button" id="bCover">Portada</button>
  <button type="button" id="bToc">Índice</button>
  <button type="button" id="bPrev" aria-label="Página anterior">&lsaquo; Anterior</button>
  <span class="ind" id="ind" aria-live="polite"></span>
  <button type="button" id="bNext" aria-label="Página siguiente">Siguiente &rsaquo;</button>
  <button type="button" id="bFs" class="ghost" aria-pressed="false" title="Página completa (tecla F)">Página completa</button>
</div>
<div class="legend" aria-label="Ejes estratégicos">
  <span><i style="background:#3acafc"></i><i style="background:#aed7ff;margin-left:-3px"></i>Probidad</span>
  <span><i style="background:#5ac599"></i><i style="background:#cfff66;margin-left:-3px"></i>Eficiencia</span>
  <span><i style="background:#193a97"></i><i style="background:#0090ff;margin-left:-3px"></i>Oportunidad y participación</span>
</div>
<div class="stage" id="stage"><div class="scaler" id="scaler"><div class="book s0" id="book"></div></div></div>

<template id="src">


<section class="pg cover" data-title="Portada">

<section class="pg eje-n" data-title="Editorial">
  <header class="pg-h"><span class="tag">Editorial</span><span>Compras Públicas en Acción</span></header>
  <div class="pg-b">
    <div><div class="kick">Borrador para revisión</div><h2>Un mes para mirar la escala de lo que se compra</h2></div>
    <p class="lede">En 2025 se transaron más de US$21.900 millones a través de Mercado Público, cerca del 6% del PIB. Con ese volumen, la calidad de cada compra deja de ser un asunto de trámite.</p>
    <p>Septiembre mostró esa escala en tres frentes. En integridad, el Observatorio derivó 56 informes a la Contraloría General de la República y envió alertas preventivas a los organismos compradores. En eficiencia, las Compras Coordinadas suman más de US$16 millones de ahorro durante el año. En participación, 95 respuestas de empresas, instituciones públicas, academia y ciudadanía ayudaron a ordenar los desafíos de la Política de Compra Pública de Innovación 2027-2028.</p>
    <p>También hubo trabajo hacia afuera. ChileCompra presentó su experiencia en Viena, intercambió prácticas con el Gobierno de Nuevo León y expuso en un seminario internacional sobre beneficiarios finales.</p>
    <p>Las páginas siguientes ordenan esos hechos por eje: probidad, eficiencia y participación. Cada cifra remite a una nota publicada en chilecompra.cl.</p>
    <div class="box" style="margin-top:auto"><b>[Nombre y cargo de quien firma]</b><div class="small">Espacio reservado para la firma de la editorial. El texto es una propuesta de redacción construida solo con datos de las notas de septiembre.</div></div>
  </div>

</section>

  var pages=Array.prototype.slice.call(src.content.querySelectorAll('section.pg'));
  var N=pages.length, leaves=N/2;
  var book=document.getElementById('book'), scaler=document.getElementById('scaler'), stage=document.getElementById('stage');
  var ind=document.getElementById('ind'), bPrev=document.getElementById('bPrev'), bNext=document.getElementById('bNext');
  var state=0, mode='', leafEls=[], zTimer=null;

  function pageNode(i){
    var n=pages[i].cloneNode(true);
    n.classList.add((i+1)%2===1?'odd':'even');
    var pn=n.querySelector('.pn'); if(pn) pn.textContent=(i+1);
    var cp=n.querySelector('#coverPhoto'); if(cp&&COVER_SRC){ var im=document.createElement('img'); im.src=COVER_SRC; im.alt='Hombre trabajando en un laptop en la cocina de su casa'; cp.innerHTML=''; cp.appendChild(im); }
    return n;
  }
  function stateFor(p){ return Math.floor(p/2); }

  function buildBook(){
    book.innerHTML=''; leafEls=[];
    var sh=document.createElement('div'); sh.className='shadow'; book.appendChild(sh);
    for(var i=0;i<leaves;i++){
      var leaf=document.createElement('div'); leaf.className='leaf';
      var f=document.createElement('div'); f.className='face front'; f.appendChild(pageNode(2*i));
      var b=document.createElement('div'); b.className='face back'; b.appendChild(pageNode(2*i+1));
      leaf.appendChild(f); leaf.appendChild(b); book.appendChild(leaf); leafEls.push(leaf);
    }
    applyState(true);
  }
  function buildFlow(){
    var flow=document.createElement('div'); flow.className='flow';
    for(var i=0;i<N;i++){
      var slot=document.createElement('div'); slot.className='slot'; slot.setAttribute('data-slot',i+1);
      slot.appendChild(pageNode(i)); flow.appendChild(slot);
    }
    book.innerHTML=''; book.appendChild(flow);
  }

  function applyState(instant){
    var changed=[];
    for(var i=0;i<leaves;i++){
      var shouldFlip=i<state, el=leafEls[i];
      if(el.classList.contains('flipped')!==shouldFlip){ changed.push(i); }
      el.classList.toggle('flipped',shouldFlip);
    }
    clearTimeout(zTimer);
    function settle(){ for(var j=0;j<leaves;j++){ leafEls[j].style.zIndex=(j<state)?(j+1):(leaves-j+1); } }
    if(instant||!changed.length){ settle(); }
    else { changed.forEach(function(j){ leafEls[j].style.zIndex=200; }); zTimer=setTimeout(settle,1000); }
    book.classList.toggle('s0',state===0);
    book.classList.toggle('s8',state===leaves);
    bPrev.disabled=(state===0); bNext.disabled=(state===leaves);
    var txt;
    if(state===0) txt='Portada';
    else if(state===leaves) txt='Contraportada';
    else txt='Páginas '+(2*state)+' y '+(2*state+1)+' de '+N;
    ind.textContent=txt;
  }
  function go(p){
    if(mode==='flow'){
      var s=book.querySelector('[data-slot="'+p+'"]'); if(s) s.scrollIntoView({behavior:'smooth',block:'start'}); return;
    }
    var t=Math.max(0,Math.min(leaves,stateFor(p)));
    if(t===state) return;
    state=t; applyState(false);
  }
  function step(d){ var t=Math.max(0,Math.min(leaves,state+d)); if(t!==state){ state=t; applyState(false);} }

  function fit(){
    var vw=stage.clientWidth;
    var wantFlow=window.innerWidth<820;
    if(wantFlow && mode!=='flow'){ mode='flow'; buildFlow(); document.querySelector('.ctrl').style.display='none'; book.className='book'; book.style.width='auto'; book.style.height='auto'; scaler.style.transform='none'; }
    if(!wantFlow && mode!=='book'){ mode='book'; document.querySelector('.ctrl').style.display=''; book.removeAttribute('style'); book.className='book'; buildBook(); }
    if(mode==='flow'){
      var s=Math.min(1,(vw)/W);
      Array.prototype.forEach.call(book.querySelectorAll('.slot'),function(sl){
        sl.style.width=(W*s)+'px'; sl.style.height=(H*s)+'px';
        sl.firstChild.style.transform='scale('+s+')';
      });
      book.style.width='100%';
      return;
    }
    var full=document.body.classList.contains('full');
    var availH=Math.max(420,window.innerHeight-(full?72:130));
    var s2=Math.min((vw-8)/(W*2+20),availH/H,full?2.2:1.25);
    scaler.style.transform='scale('+s2+')';
    scaler.style.width=(W*2*s2)+'px';
    scaler.style.height=(H*s2+24)+'px';
    scaler.style.transformOrigin='top left';
  }
  scaler.style.transformOrigin='top left';

  document.addEventListener('click',function(e){
    var g=e.target.closest&&e.target.closest('[data-go]');
    if(g){ e.preventDefault(); go(parseInt(g.getAttribute('data-go'),10)); return; }
    if(mode==='book' && e.target.closest && e.target.closest('.book') && !e.target.closest('a')){
      var r=book.getBoundingClientRect();
      var rel=(e.clientX-r.left)/r.width;
      if(state===0){ step(1); }
      else if(state===leaves){ step(-1); }
      else { step(rel>0.5?1:-1); }
    }
  });
  document.addEventListener('keydown',function(e){
    if(mode!=='book') return;
    if(e.key==='ArrowRight'||e.key==='PageDown') step(1);
    else if(e.key==='ArrowLeft'||e.key==='PageUp') step(-1);
    else if(e.key==='Home') go(1);
    else if(e.key==='End') go(N);
  });
  var sx=null;
  stage.addEventListener('pointerdown',function(e){ sx=e.clientX; });
  stage.addEventListener('pointerup',function(e){
    if(sx===null||mode!=='book') return;
    var dx=e.clientX-sx; sx=null;
    if(Math.abs(dx)>60){ step(dx<0?1:-1); }
  });
  document.getElementById('bPrev').onclick=function(){ step(-1); };
  document.getElementById('bNext').onclick=function(){ step(1); };
  var bFs=document.getElementById('bFs'), de=document.documentElement;
  function setFull(on){
    document.body.classList.toggle('full',on);
    bFs.setAttribute('aria-pressed',on?'true':'false');
    bFs.textContent=on?'Salir de página completa':'Página completa';
    fit();
  }
  function toggleFull(){
    var on=!document.body.classList.contains('full');
    if(on){
      setFull(true);
      try{ var p=de.requestFullscreen&&de.requestFullscreen(); if(p&&p.catch){ p.catch(function(){}); } }catch(err){}
    } else {
      try{ if(document.fullscreenElement&&document.exitFullscreen){ document.exitFullscreen(); } }catch(err){}
      setFull(false);
    }
  }
  bFs.onclick=toggleFull;
  document.addEventListener('fullscreenchange',function(){
    if(!document.fullscreenElement && document.body.classList.contains('full')){ setFull(false); }
  });
  document.addEventListener('keydown',function(e){
    if((e.key==='f'||e.key==='F')&&!e.ctrlKey&&!e.metaKey&&!e.altKey){ toggleFull(); }
  });
  document.getElementById('bCover').onclick=function(){ go(1); };
  document.getElementById('bToc').onclick=function(){ go(2); };
  window.addEventListener('resize',fit);

  fit();
  try{ var m=/^#p(\d+)$/.exec(location.hash); if(m&&mode==='book'){ state=Math.max(0,Math.min(leaves,stateFor(parseInt(m[1],10)))); applyState(true); } }catch(err){}
})();
